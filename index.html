<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumenstru AI Prototype</title>
<!-- Lumenstru AI high-fidelity prototype: plain HTML, CSS and JS in one file.
     All data is example data made relative to today. -->
<style>
/* fonts are stored locally so it works offline */
@font-face { font-family: 'Lora'; font-weight: 500; font-style: normal; src: url('assets/fonts/lora_medium.ttf') format('truetype'); }
@font-face { font-family: 'Lora'; font-weight: 600; font-style: normal; src: url('assets/fonts/lora_semibold.ttf') format('truetype'); }
@font-face { font-family: 'Lora'; font-weight: 500; font-style: italic; src: url('assets/fonts/lora_medium_italic.ttf') format('truetype'); }
@font-face { font-family: 'DM Sans'; font-weight: 400; font-style: normal; src: url('assets/fonts/dm_sans_regular.ttf') format('truetype'); }
@font-face { font-family: 'DM Sans'; font-weight: 500; font-style: normal; src: url('assets/fonts/dm_sans_medium.ttf') format('truetype'); }
@font-face { font-family: 'DM Sans'; font-weight: 600; font-style: normal; src: url('assets/fonts/dm_sans_semibold.ttf') format('truetype'); }
@font-face { font-family: 'DM Sans'; font-weight: 700; font-style: normal; src: url('assets/fonts/dm_sans_bold.ttf') format('truetype'); }

  /* Matcha = light mode, Lavender = dark mode */
  :root {
    --page: #F2EFE9;
    --bg: #FBF9F6;
    --card: #F2EFE9;
    --line: #E3DED5;
    --primary: #5A7156;
    --rose: #E5A99E;      /* only for period things */
    --rose-ink: #9C5547;
    --ink: #2A3229;
    --ink2: #5F685D;
    --muted: #8D958B;
    --on-primary: #FBF9F6;
    --bezel: #2A3229;
    /* soft blush and matcha glows behind the page and inside the phone */
    --page-art: radial-gradient(760px 520px at 10% -6%, rgba(249, 209, 217, 0.80), transparent 60%),
                radial-gradient(700px 520px at 94% 4%, rgba(199, 210, 166, 0.58), transparent 62%),
                radial-gradient(680px 600px at 80% 104%, rgba(249, 209, 217, 0.55), transparent 60%),
                radial-gradient(620px 520px at 2% 96%, rgba(199, 210, 166, 0.45), transparent 60%);
    --screen-art: radial-gradient(130% 50% at 8% 0%, rgba(249, 209, 217, 0.70), transparent 62%),
                  radial-gradient(120% 45% at 100% 32%, rgba(206, 220, 168, 0.42), transparent 62%),
                  radial-gradient(130% 50% at 100% 100%, rgba(249, 209, 217, 0.45), transparent 62%);
    /* mascot is green by day, pink at night */
    --mascot-day: url("assets/images/mascot-day.webp");
    --mascot-night: url("assets/images/mascot-night.webp");
    --mascot: var(--mascot-day);
    --serif: "Lora", Georgia, "Times New Roman", serif;
    --sans: "DM Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #070D1A; --bg: #0B1325; --card: #182238; --line: #26314C; --primary: #C3B5E3; --rose: #E5A99E;
      --rose-ink: #F0BDB3; --ink: #EAEFF8; --ink2: #B4BDD2; --muted: #4E5978; --on-primary: #0B1325;
      --bezel: #182238; --mascot: var(--mascot-night); color-scheme: dark;
      --page-art: radial-gradient(820px 560px at 10% -8%, rgba(155, 135, 196, 0.30), transparent 62%), radial-gradient(760px 560px at 94% 2%, rgba(199, 182, 232, 0.16), transparent 62%), radial-gradient(700px 640px at 72% 104%, rgba(120, 98, 160, 0.24), transparent 62%); --screen-art: radial-gradient(110% 42% at 12% 0%, rgba(150, 120, 210, 0.30), transparent 66%), radial-gradient(100% 40% at 96% 96%, rgba(112, 98, 206, 0.24), transparent 68%);
    }
  }
  :root[data-theme="dark"] {
    --page: #070D1A; --bg: #0B1325; --card: #182238; --line: #26314C; --primary: #C3B5E3; --rose: #E5A99E;
    --rose-ink: #F0BDB3; --ink: #EAEFF8; --ink2: #B4BDD2; --muted: #4E5978; --on-primary: #0B1325;
    --bezel: #182238; --mascot: var(--mascot-night); color-scheme: dark;
      --page-art: radial-gradient(820px 560px at 10% -8%, rgba(155, 135, 196, 0.30), transparent 62%), radial-gradient(760px 560px at 94% 2%, rgba(199, 182, 232, 0.16), transparent 62%), radial-gradient(700px 640px at 72% 104%, rgba(120, 98, 160, 0.24), transparent 62%); --screen-art: radial-gradient(110% 42% at 12% 0%, rgba(150, 120, 210, 0.30), transparent 66%), radial-gradient(100% 40% at 96% 96%, rgba(112, 98, 206, 0.24), transparent 68%);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page-art), var(--page);
    background-attachment: fixed;
    min-height: 100vh;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    padding-inline: 16px;
  }
  h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; text-wrap: balance; }
  h1 { font-size: 26px; }
  h2 { font-size: 20px; }
  h3 { font-size: 17px; }
  p { margin: 0; }

  /* page layout: top bar, navigator and phone frame */
  .wrap { max-width: 980px; margin: 0 auto; padding-block: 24px 40px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand { font-family: var(--serif); font-size: 26px; font-weight: 600; background: transparent; color: var(--ink); border: 0; cursor: pointer; padding: 0; }
  .brand i { color: var(--primary); font-style: italic; }
  .modes { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
  .modebtn { border: 0; background: transparent; color: var(--ink2); border-radius: 999px; padding: 8px 16px; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
  .modebtn.on { background: var(--primary); color: var(--on-primary); }

  .layout { display: grid; grid-template-columns: 240px 1fr; gap: 32px; margin-top: 24px; align-items: start; }
  .layout > * { min-width: 0; }
  .side { position: sticky; top: 20px; background: var(--bg); border: 1px solid var(--line); border-radius: 22px; padding: 20px 16px; }
  .side h3 { font-style: italic; }
  .side .hint { font-size: 12px; color: var(--ink2); margin: 2px 0 14px; }
  .devnav { display: grid; gap: 2px; }
  .devnav button { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; color: var(--ink2); font: inherit; font-size: 14px; text-align: left; padding: 8px 10px; border-radius: 12px; cursor: pointer; }
  .devnav button svg { width: 17px; height: 17px; flex-shrink: 0; }
  .devnav button:hover { background: var(--card); color: var(--ink); }
  .devnav button.on { background: var(--card); color: var(--primary); font-weight: 700; }
  .side hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .side .note { font-size: 12px; color: var(--ink2); }

  .preview { display: flex; justify-content: center; }
  .phone { width: 392px; max-width: 100%; height: 812px; border: 10px solid var(--bezel); border-radius: 46px; background: var(--bg); position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 120px; height: 24px; background: var(--bezel); border-radius: 0 0 16px 16px; z-index: 6; }
  .statusbar { display: flex; justify-content: space-between; padding: 10px 24px 4px; font-size: 12px; font-weight: 700; color: var(--ink); }
  .screen { flex: 1; overflow-y: auto; padding: 8px 18px 24px; display: flex; flex-direction: column; gap: 16px;
    background-image: var(--screen-art); }
  .screen > * { flex-shrink: 0; }   /* stop long screens squashing cards */
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--card); border-top: 1px solid var(--line); padding-bottom: 6px; }
  .tabbar button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 11px; padding: 8px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
  .tabbar button.on { color: var(--primary); font-weight: 700; }
  .tabbar svg { width: 20px; height: 20px; }
  .tabbar[hidden] { display: none; }

  /* app screens */
  .sub { color: var(--ink2); font-size: 14px; }
  .small { font-size: 13px; color: var(--ink2); }
  .label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink2); font-weight: 700; }
  .num { font-variant-numeric: tabular-nums; }
  .example { font-size: 11px; color: var(--muted); }

  .card { background: var(--card); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.between { justify-content: space-between; }
  .grow { flex: 1; min-width: 0; }
  .center { text-align: center; align-items: center; }
  .screen hr { border: 0; border-top: 1px solid var(--line); margin: 0; }

  .btn { font: inherit; cursor: pointer; border: 0; background: var(--primary); color: var(--on-primary); border-radius: 999px; padding: 12px 18px; font-weight: 700; }
  .btn.ghost { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
  .btn.small { padding: 7px 14px; font-size: 13px; }
  .btn.block { width: 100%; }
  .btn.rose { background: var(--rose); color: #2A3229; }
  .link { border: 0; background: transparent; color: var(--rose-ink); font: inherit; font-weight: 700; cursor: pointer; padding: 4px; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: var(--ink2); }

  .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
  .iconbtn svg { width: 19px; height: 19px; }

  /* cycle ring */
  .ring-wrap { display: grid; place-items: center; position: relative; }
  .ring-text { position: absolute; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .ring-text .big { font-family: var(--serif); font-size: 44px; line-height: 1.05; }
  .ring-text .phase { font-family: var(--serif); font-style: italic; color: var(--rose-ink); }
  .hero-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .hero-actions svg { width: 15px; height: 15px; vertical-align: -2px; margin-right: 4px; }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
  .tile { border: 0; background: transparent; color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 5px; font: inherit; font-size: 11px; cursor: pointer; padding: 2px 0; }
  .tile .circle { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--primary); }
  .tile svg { width: 19px; height: 19px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .stats.two { grid-template-columns: 1fr 1fr; }
  .stat strong { display: block; font-family: var(--serif); font-size: 20px; font-weight: 600; }
  .stat small { font-size: 11px; color: var(--ink2); }

  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--card); border-radius: 999px; }
  .tabs.two { grid-template-columns: 1fr 1fr; }
  .tabs button { border: 0; background: transparent; color: var(--ink2); font: inherit; font-size: 13px; font-weight: 700; padding: 7px 0; border-radius: 999px; cursor: pointer; }
  .tabs button.on { background: var(--bg); color: var(--primary); }

  .note { color: var(--rose-ink); font-size: 13px; }
  .notice { display: flex; gap: 10px; align-items: flex-start; background: var(--card); border-left: 4px solid var(--rose); border-radius: 14px; padding: 12px 14px; }
  .notice svg { width: 20px; height: 20px; color: var(--rose-ink); flex-shrink: 0; margin-top: 2px; }
  .task { display: flex; gap: 12px; align-items: center; padding: 8px 0; cursor: pointer; }
  .task input { width: 20px; height: 20px; accent-color: var(--primary); flex-shrink: 0; }
  .task.done .name { text-decoration: line-through; color: var(--muted); }
  .badge { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; border-radius: 999px; padding: 2px 8px; border: 1px solid var(--primary); color: var(--primary); }
  .badge.LOW { border-color: var(--line); color: var(--ink2); }
  .pill { font-size: 11px; border-radius: 999px; padding: 2px 9px; border: 1px solid var(--line); color: var(--ink2); white-space: nowrap; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: transparent; border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  .chip.rose.on { background: var(--rose); color: #2A3229; border-color: var(--rose); }
  .diff { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .diff .chip { font-family: var(--serif); font-size: 16px; padding: 8px 0; }

  .month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
  .month .dow { font-size: 11px; color: var(--muted); }
  .day { aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: transparent; color: var(--ink); font-family: var(--serif); font-size: 14px; display: grid; place-items: center; border: 1.5px solid transparent; cursor: pointer; }
  .day.period { background: var(--rose); color: #2A3229; }
  .day.today { border-color: var(--primary); }
  .day.selected { outline: 2px solid var(--ink); outline-offset: 1px; }
  .day:disabled { opacity: 0.3; cursor: default; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink2); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; }

  .group { background: var(--card); border-radius: 18px; overflow: hidden; }
  .setting { display: flex; align-items: center; gap: 10px; padding: 12px 14px; width: 100%; border: 0; background: transparent; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
  .group .setting + .setting { border-top: 1px solid var(--line); }
  .setting svg { width: 18px; height: 18px; color: var(--primary); flex-shrink: 0; }
  .setting .chev { color: var(--muted); }

  .switch { appearance: none; -webkit-appearance: none; width: 44px; height: 26px; border-radius: 99px; background: var(--line); position: relative; cursor: pointer; flex-shrink: 0; border: 0; padding: 0; transition: background 0.2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); transition: left 0.2s; }
  .switch:checked { background: var(--rose); }
  .switch:checked::after { left: 21px; }

  .disc { width: 124px; height: 124px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--bg); display: grid; place-items: center; margin: 4px auto 2px; }
  .play { width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
  .play.small { width: 44px; height: 44px; }
  .play svg { width: 22px; height: 22px; }
  .progress { width: 100%; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .progress span { display: block; height: 100%; background: var(--primary); }
  .setting.picked b { color: var(--primary); }
  .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tool { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 4px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; }
  .tool svg { width: 20px; height: 20px; color: var(--primary); }

  .chat { display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 85%; padding: 9px 12px; border-radius: 16px; font-size: 14px; }
  .msg.bot { background: var(--card); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.me { background: var(--primary); color: var(--on-primary); align-self: flex-end; border-bottom-right-radius: 4px; }

  .overlay { position: absolute; inset: 0; background: rgba(11, 19, 37, 0.45); z-index: 8; display: flex; align-items: flex-end; }
  .sheet { background: var(--bg); width: 100%; max-height: 86%; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 12px 16px 22px; display: flex; flex-direction: column; gap: 12px; }
  .handle { width: 42px; height: 5px; border-radius: 5px; background: var(--line); margin: 0 auto 4px; }
  .toast { position: absolute; left: 10px; right: 10px; top: 34px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; z-index: 9; display: flex; gap: 10px; }

  .mascot { display: inline-block; width: var(--size, 64px); height: var(--size, 64px); background: var(--mascot) center / contain no-repeat; flex-shrink: 0; }
  .mascot.bob { animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  .side .mascot { display: block; margin: 0 auto 10px; }

  /* phones: show the app first, navigator underneath */
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; gap: 20px; }
    .preview { order: -1; }
    .side { position: static; }
    .devnav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .phone { border-width: 6px; border-radius: 34px; height: 740px; }
    .topbar { justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) { .mascot.bob { animation: none; } .switch, .switch::after { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="brand" onclick="go('dashboard')">Lumenstru <i>AI</i></button>
    <div class="modes" role="group" aria-label="Mode">
      <button class="modebtn" id="btn-matcha" onclick="setMode('light')">Matcha Mode</button>
      <button class="modebtn" id="btn-lavender" onclick="setMode('dark')">Lavender Mode</button>
    </div>
  </div>

  <div class="layout">
    <aside class="side">
      <span class="mascot bob" style="--size:84px" aria-hidden="true"></span>
      <h3>Prototype Navigator</h3>
      <p class="hint">Every screen is live. Tap around freely.</p>
      <div class="devnav" id="devnav"></div>
      <hr>
      <p class="note">High-fidelity, clickable prototype of Lumenstru AI with the features of the September design. Example data, made relative to today.</p>
    </aside>

    <main class="preview">
      <div class="phone" id="phone">
        <div class="notch"></div>
        <div class="statusbar"><span id="clock" class="num">9:41</span><span>LTE · 87%</span></div>
        <div class="screen" id="screen"></div>
        <div class="tabbar" id="tabbar"></div>
        <div id="sheet-root"></div>
        <div id="toast-root"></div>
      </div>
    </main>
  </div>
</div>

<script>
// ----- helpers -----
const DAY = 86400000;
const TODAY = new Date();
TODAY.setHours(0, 0, 0, 0);

function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}
// dates are stored as "YYYY-MM-DD" text, so they are easy to compare
function iso(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function fromIso(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
const TODAY_ISO = iso(TODAY);
function daysBetween(a, b) {
  return Math.round((fromIso(b) - fromIso(a)) / DAY);
}
function shortDate(s) {
  return fromIso(s).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
}
function longDate(s) {
  return fromIso(s).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
}
function dueLabel(s) {
  if (s === TODAY_ISO) return "Today";
  if (s === iso(addDays(TODAY, 1))) return "Tomorrow";
  return fromIso(s).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
}
// escape user text so it can't break the HTML
function esc(text) {
  return String(text).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
// remember the chosen mode in the browser (try/catch in case storage is blocked)
function load(key, fallback) {
  try { const v = localStorage.getItem("lumenstru_" + key); return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem("lumenstru_" + key, JSON.stringify(value)); } catch (e) { /* ignore */ }
}

// ----- example data (relative to today) -----
let userName = "Sameeha";
const USER_EMAIL = "sameeha@example.com";
const PERIOD_LENGTH = 5;

// each period has a start, an end (null while it is still going) and the days that were logged
let periods = [];
(function makePeriods() {
  const gaps = [29, 31, 28];            // past cycle lengths
  let start = addDays(TODAY, -13);      // the last period started 13 days ago (cycle day 14)
  const starts = [start];
  for (const g of gaps) { start = addDays(start, -g); starts.unshift(start); }
  for (const s of starts) {
    periods.push({ start: iso(s), end: iso(addDays(s, PERIOD_LENGTH - 1)), logs: {} });
  }
  periods[periods.length - 1].logs[periods[periods.length - 1].start] = { flow: "Medium", severity: "Mild", symptoms: ["Cramps"], mood: "Calm" };
})();

let nextTaskId = 8;
let tasks = [
  { id: 1, name: "Finish OS lab report", difficulty: 4, energy: "high", due: 0, done: false },

// ----- cycle: day, phase and energy -----
function sortedPeriods() {
  return periods.slice().sort((a, b) => (a.start < b.start ? -1 : 1));
}
function activePeriod() {
  return periods.find(p => !p.end) || null;
}
// the period that covers a day (a period still going runs up to today)
function periodOn(day) {
  return periods.find(p => day >= p.start && day <= (p.end || TODAY_ISO)) || null;
}
// average gap between period starts, or 28 if there is no data yet
function cycleLength() {
  const list = sortedPeriods();
  let total = 0, count = 0;
  for (let i = 1; i < list.length; i++) {
    const gap = daysBetween(list[i - 1].start, list[i].start);
    if (gap >= 15 && gap <= 60) { total += gap; count++; }  // shorter or longer = a missed log
  }
  return count ? Math.round(total / count) : 28;
}
// phase and energy for any day
function dayInfo(day) {
  const len = cycleLength();
  let start = null;
  for (const p of sortedPeriods()) if (p.start <= day) start = p.start;
  if (!start) return { phase: "", energy: "Steady", cycleDay: 0 };
  let cycleDay = daysBetween(start, day) + 1;
  if (day > TODAY_ISO) cycleDay = ((cycleDay - 1) % len) + 1;  // future days repeat the cycle

  const ovulation = len - 14;
  let phase = "Luteal";
  if (periodOn(day) || (day > TODAY_ISO && cycleDay <= PERIOD_LENGTH)) phase = "Menstrual";
  else if (cycleDay < ovulation - 1) phase = "Follicular";
  else if (cycleDay <= ovulation + 1) phase = "Ovulatory";

  let energy = "Steady";
  if (phase === "Follicular" || phase === "Ovulatory") energy = "High";
  if (phase === "Menstrual" || (phase === "Luteal" && len - cycleDay <= 2)) energy = "Low";
  return { phase, energy, cycleDay };
}

function cycleRing(info) {
  const len = cycleLength();
  const r = 92, c = 2 * Math.PI * r;
  const progress = Math.min(1, info.cycleDay / len);
  const periodPart = PERIOD_LENGTH / len;   // the rose arc is the period days
  const dotX = 105 + r * Math.sin(2 * Math.PI * progress);
  const dotY = 105 - r * Math.cos(2 * Math.PI * progress);
  return '<div class="ring-wrap">' +
    '<svg width="210" height="210" viewBox="0 0 210 210" role="img" aria-label="Cycle day ' + info.cycleDay + '">' +
      '<g transform="rotate(-90 105 105)">' +
        '<circle cx="105" cy="105" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="5"/>' +
        '<circle cx="105" cy="105" r="' + r + '" fill="none" stroke="var(--rose)" stroke-width="5" stroke-dasharray="' + (c * periodPart) + " " + c + '" stroke-linecap="round"/>' +
        '<circle cx="105" cy="105" r="' + r + '" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="' + (c * progress) + " " + c + '"/>' +
      "</g>" +
      '<circle cx="' + dotX + '" cy="' + dotY + '" r="6" fill="var(--primary)"/>' +
    "</svg>" +
    '<div class="ring-text"><span class="label">Cycle day</span><span class="big num">' + info.cycleDay + "</span>" +
      '<span class="small">Estimated</span><span class="phase">' + info.phase + "</span></div>" +
  "</div>";
}

function monthGrid(month, selected, pick, maxDay) {
  const year = month.getFullYear(), m = month.getMonth();
  const offset = (new Date(year, m, 1).getDay() + 6) % 7; // weeks start on Monday
  const count = new Date(year, m + 1, 0).getDate();
  let grid = ["M", "T", "W", "T", "F", "S", "S"].map(d => '<div class="dow">' + d + "</div>").join("");
  for (let i = 0; i < offset; i++) grid += "<div></div>";
  for (let d = 1; d <= count; d++) {
    const day = iso(new Date(year, m, d));
    let cls = "day num";
    if (periodOn(day) && day <= TODAY_ISO) cls += " period";
    if (day === TODAY_ISO) cls += " today";
    if (day === selected) cls += " selected";
    const off = maxDay && day > maxDay ? " disabled" : "";
    grid += '<button class="' + cls + '"' + off + ' onclick="' + pick + "('" + day + "')\">" + d + "</button>";
  }
  return '<div class="month">' + grid + "</div>";
}

let log = {};   // the day being logged and its answers
function startLog(day) {
  const saved = periodOn(day) ? periodOn(day).logs[day] : null;
  log = {
    day: day,
    month: new Date(fromIso(day).getFullYear(), fromIso(day).getMonth(), 1),
    flow: saved ? saved.flow : "",
    severity: saved ? saved.severity : "",
    symptoms: saved ? saved.symptoms.slice() : [],
    mood: saved ? saved.mood : "",
    end: false,
  };
}
function pickLogDay(day) {
  startLog(day);
  render();
}
function moveLogMonth(n) {
  log.month = new Date(log.month.getFullYear(), log.month.getMonth() + n, 1);
  render();
}
function chipGroup(field, options, multi) {
  return '<div class="chips">' + options.map(o => {
    const on = multi ? log[field].includes(o) : log[field] === o;
    return '<button class="chip rose ' + (on ? "on" : "") + '" onclick="pickChip(\'' + field + "', '" + o + "', " + multi + ')">' + o + "</button>";
  }).join("") + "</div>";
}
function pickChip(field, value, multi) {
  if (multi) {
    const i = log[field].indexOf(value);
    if (i >= 0) log[field].splice(i, 1); else log[field].push(value);
  } else {
    log[field] = log[field] === value ? "" : value;
  }
  render();
}

function logPeriodScreen() {
  const rec = periodOn(log.day);
  const active = activePeriod();
  const starting = !rec && !active;              // this day starts a new period
  const canEnd = active && rec === active;       // a period is going, so it can end here
  const saved = rec && rec.logs[log.day];

  const status = starting
    ? '<div class="notice">' + icon("drop") + '<div><b>No period in progress</b><p class="small">Saving this day will start a new period.</p></div></div>'
    : '<div class="notice">' + icon("drop") + "<div><b>" + (rec && rec.end ? "Past period" : "Period in progress") + "</b>" +
      '<p class="small">Started ' + shortDate((rec || active).start) + (rec && rec.end ? ", ended " + shortDate(rec.end) : "") + ". You are logging one day of it.</p></div></div>";

  let label = log.day === TODAY_ISO ? "Save today's info" : "Save this day's info";
  if (starting) label = "Save and start period";
  if (canEnd && log.end) label = "Save and end period";

  return header("Log Period", "Logging helps me plan with you", "dashboard") +
    status +
    '<section class="card"><div class="row between"><span class="label">Selected day</span>' +
      (saved ? '<span class="pill">Saved</span>' : "") + "</div><h3>" + longDate(log.day) + "</h3>" +
      monthNav(log.month, "moveLogMonth") + monthGrid(log.month, log.day, "pickLogDay", TODAY_ISO) +
      '<p class="small">Tap any past day to fill in what you missed. Future days can\'t be logged.</p></section>' +
    '<section class="card"><span class="label">Flow</span>' + chipGroup("flow", ["Light", "Medium", "Heavy"], false) + "</section>" +
    '<section class="card"><span class="label">Symptom severity</span>' + chipGroup("severity", ["Mild", "Moderate", "Severe"], false) + "</section>" +
    '<section class="card"><span class="label">Symptoms</span>' + chipGroup("symptoms", ["Cramps", "Fatigue", "Headache", "Bloating", "Mood swings", "Cravings"], true) + "</section>" +
    '<section class="card"><span class="label">Mood</span>' +
      chipGroup("mood", ["Happy", "Calm", "Energetic", "Good", "Neutral", "Tired", "Sad", "Irritated", "Anxious", "Low energy", "Sensitive"], false) +
      '<p class="small">Your mood helps Lumenstru plan tasks around your energy.</p></section>' +
    (canEnd ? '<section class="card"><div class="row"><label class="grow" for="end-switch"><b>End period</b><br><span class="small">' +
      (log.end ? "Your period ends on " + shortDate(log.day) + "." : "Turn on if this is your last day.") + "</span></label>" +
      '<input type="checkbox" class="switch" id="end-switch" ' + (log.end ? "checked" : "") + ' onchange="log.end = this.checked; render()"></div></section>' : "") +
    '<button class="btn block" onclick="saveLog()">' + label + "</button>";
}

function saveLog() {
  const answers = { flow: log.flow, severity: log.severity, symptoms: log.symptoms.slice(), mood: log.mood };
  const active = activePeriod();
  const rec = periodOn(log.day) || active;

  // 1. no period covers this day: it starts a new one, and the app turns to Lavender Mode
  if (!rec) {
    periods.push({ start: log.day, end: null, logs: { [log.day]: answers } });
    setMode("dark");
    go("dashboard");
    toast("Period started", "Logged for " + shortDate(log.day) + ". Lavender Mode is on.");
    return;
  }
  // 2. save the day into the period it belongs to
  rec.logs[log.day] = answers;
  if (log.day < rec.start) rec.start = log.day;

  // 3. end the period if the switch is on, and go back to Matcha Mode
  if (log.end && !rec.end) {
    rec.end = log.day;
    setMode("light");
    go("dashboard");
    toast("Period ended", shortDate(rec.start) + " to " + shortDate(log.day) + ". Matcha Mode is on.");
    return;
  }
  go("dashboard");
  toast("Saved", "Your log for " + shortDate(log.day) + " is saved.");
}

// ----- Tasks + Add Task -----
let taskTab = "all";
function tasksScreen() {
  let list = tasks;
  if (taskTab === "today") list = tasks.filter(t => t.due === TODAY_ISO);
  if (taskTab === "upcoming") list = tasks.filter(t => t.due > TODAY_ISO);
  list = sortTasks(list);
  const high = list.filter(t => t.energy !== "low");
  const low = list.filter(t => t.energy === "low");
  const tab = (key, name) => '<button class="' + (taskTab === key ? "on" : "") + '" onclick="taskTab = \'' + key + '\'; render()">' + name + "</button>";
  return header("Tasks", "Small steps count") +
    '<div class="tabs">' + tab("all", "All") + tab("today", "Today") + tab("upcoming", "Upcoming") + "</div>" +
    '<button class="btn block" onclick="go(\'addTask\')">+ Add a task</button>' +
    '<span class="label">High-energy days (Follicular / Ovulatory)</span>' +
    '<section class="card">' + (high.map(taskRow).join("") || '<p class="small">Nothing here right now.</p>') + "</section>" +
    '<span class="label">Low-energy days (Luteal / Menstrual)</span>' +
    '<section class="card">' + (low.map(taskRow).join("") || '<p class="small">Nothing here right now.</p>') + "</section>";
}

let newTask = { name: "", difficulty: 3, energy: "high", due: "" };
function addTaskScreen() {
  const n = newTask;
  const diff = [1, 2, 3, 4, 5].map(v => '<button type="button" class="chip ' + (n.difficulty === v ? "on" : "") + '" onclick="newTask.difficulty = ' + v + '; render()">' + v + "</button>").join("");
  const energy = [["high", "High"], ["med", "Medium"], ["low", "Low"]].map(e =>
    '<button type="button" class="chip ' + (n.energy === e[0] ? "on" : "") + '" onclick="newTask.energy = \'' + e[0] + '\'; render()">' + e[1] + "</button>").join("");
  return header("Add Task", "A new to-do", "tasks") +
    '<form class="card" onsubmit="addTask(event)">' +
      '<label class="field" for="t-name">1. Task name<input id="t-name" placeholder="e.g. Revise for AI quiz" value="' + esc(n.name) + '" oninput="newTask.name = this.value"></label>' +
      '<div class="field">2. Difficulty (1 = easy, 5 = very hard)<div class="diff">' + diff + "</div></div>" +
      '<div class="field">3. Energy needed<div class="chips">' + energy + "</div></div>" +
      '<label class="field" for="t-due">4. Due date<input id="t-due" type="date" min="' + TODAY_ISO + '" value="' + n.due + '" oninput="newTask.due = this.value"></label>' +
      '<button class="btn block" type="submit">Save task</button>' +
    "</form>";
}
function addTask(e) {
  e.preventDefault();
  const name = newTask.name.trim();
  if (!name) { toast("Name needed", "Give your task a name first."); return; }
  tasks.push({ id: nextTaskId++, name: name, difficulty: newTask.difficulty, energy: newTask.energy, due: newTask.due || iso(addDays(TODAY, 7)), done: false });
  go("tasks");
  toast("Task added", name + " is on your list.");
}

// ----- Calm Space -----
// the same three 2-minute tracks as the app (royalty-free, Pixabay)
const TRACKS = [
  { title: "Focus Track", text: "Alpha-wave study music for deep focus", file: "assets/audio/calm1.mp3" },
  { title: "Relaxation Track", text: "174 Hz relaxing tones for cramp comfort", file: "assets/audio/calm2.mp3" },
  { title: "Sleep Track", text: "Soft music for sleep", file: "assets/audio/calm3.mp3" },
];
const TOOLS = {
  Breathing: "Breathe in for 4 counts, hold for 4, then breathe out for 6. Repeat five times.",
  Meditation: "Close your eyes. Notice five things you can hear, four you can feel and three you can smell.",
  Stretching: "Roll your shoulders back, reach your arms overhead and gently twist from side to side.",
};

const player = new Audio();
player.loop = true;
let trackIndex = 0;

// time like 1:05
function mmss(sec) {
  sec = Math.floor(sec || 0);
  return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
}

function calmScreen() {
  const t = TRACKS[trackIndex];
  const playing = !player.paused;
  return header("Calm Space", "A few quiet minutes") +
    '<section class="card center">' +
      '<span class="label">' + (playing ? "Now playing" : "Paused") + "</span>" +
      '<div class="disc"><span class="mascot ' + (playing ? "bob" : "") + '" style="--size:80px" aria-hidden="true"></span></div>' +
      "<h3>" + t.title + '</h3><p class="small">' + t.text + "</p>" +
      '<button class="play" aria-label="' + (playing ? "Pause" : "Play") + '" onclick="playTrack(' + trackIndex + ')">' + icon(playing ? "pause" : "play") + "</button>" +
      '<div class="progress"><span id="calm-bar" style="width:' + (player.duration ? player.currentTime / player.duration * 100 : 0) + '%"></span></div>' +
      '<div class="row between small" style="width:100%"><span id="calm-time" class="num">' + mmss(player.currentTime) + '</span><span class="num">2:00</span></div>' +
    "</section>" +
    '<span class="label">Quick relax</span>' +
    '<div class="group">' + TRACKS.map((tr, i) =>
      '<button class="setting' + (i === trackIndex ? " picked" : "") + '" onclick="playTrack(' + i + ')">' +
        '<span class="grow"><b>' + tr.title + '</b><br><span class="small">' + tr.text + "</span></span>" +
        '<span class="small num">2:00</span>' + icon(i === trackIndex && playing ? "pause" : "play") + "</button>"
    ).join("") + "</div>" +
    '<span class="label">Tools</span>' +
    '<div class="tools">' +
      '<button class="tool" onclick="openTool(\'Breathing\')">' + icon("wind") + "Breathing</button>" +
      '<button class="tool" onclick="openTool(\'Meditation\')">' + icon("calm") + "Meditation</button>" +
      '<button class="tool" onclick="openTool(\'Stretching\')">' + icon("heart") + "Stretching</button>" +
    "</div>";
}

function playTrack(i) {
  if (i === trackIndex && !player.paused) {
    player.pause();
  } else {
    if (i !== trackIndex || !player.src) {
      trackIndex = i;
      player.src = TRACKS[i].file;
    }
    player.play().catch(() => toast("Can't play", "Your browser blocked the audio. Tap play again."));
  }
  render();
}
// move the progress bar without drawing the whole screen again
player.addEventListener("timeupdate", () => {
  const bar = document.getElementById("calm-bar");
  if (!bar || !player.duration) return;
  bar.style.width = (player.currentTime / player.duration * 100) + "%";
  document.getElementById("calm-time").textContent = mmss(player.currentTime);
});
player.addEventListener("play", render);
player.addEventListener("pause", render);

function openTool(name) {
  openSheet(name, '<p>' + TOOLS[name] + "</p>");
}

// ----- AI Assistant (scripted replies for the prototype) -----
let chat = [{ me: false, text: "Hi " + userName + ". I'm here to help. Ask me about tasks, energy or how you're feeling." }];
const PROMPTS = ["Suggest a focus task", "How can I manage my energy today?", "Tips to improve my sleep", "I'm feeling stressed"];

function aiScreen() {
  return header("AI Assistant", "Your study and wellbeing helper", "dashboard") +
    '<div class="chips">' + PROMPTS.map((q, i) => '<button class="chip" onclick="ask(PROMPTS[' + i + '])">' + esc(q) + "</button>").join("") + "</div>" +
    '<div class="chat">' + chat.map(m => '<div class="msg ' + (m.me ? "me" : "bot") + '">' + esc(m.text) + "</div>").join("") + "</div>" +
    '<form class="row" onsubmit="event.preventDefault(); ask(document.getElementById(\'ai-input\').value)">' +
      '<input id="ai-input" placeholder="Type your message" aria-label="Message"><button class="btn small" type="submit">Send</button>' +
    "</form>";
}
function ask(question) {
  if (!question.trim()) return;
  chat.push({ me: true, text: question });
  chat.push({ me: false, text: answer(question.toLowerCase()) });
  render();
  const box = document.getElementById("screen");
  box.scrollTop = box.scrollHeight;
}
function answer(q) {
  const info = dayInfo(TODAY_ISO);
  const focus = focusTask();
  if (q.includes("focus")) return focus ? "Try \"" + focus.name + "\". It matters most and is due " + dueLabel(focus.due).toLowerCase() + "." : "You're all caught up.";
  if (q.includes("energy")) return "You're in your " + info.phase + " phase, so today looks like a " + info.energy.toLowerCase() + " energy day. " +
    (info.energy === "High" ? "A good day to do your hardest task first." : "Keep tasks light and take breaks.");
  if (q.includes("sleep")) return "Try a wind-down routine: dim the lights an hour before bed and play the Sleep Track in Calm Space.";
  if (q.includes("stress")) return "Let's take a breath together. Open Calm Space and try the Breathing tool for a minute.";
  if (q.includes("task")) return "Open the Tasks tab. I'll help you sort them by what matters most.";
  if (q.includes("period") || q.includes("cycle")) return "You can log your period any time from the Dashboard. Tap Log Period.";
  return "I'm still learning. Try one of the suggestions above.";
}

// ----- Reminders (the Survival Suite) -----
let remTab = "reminders";
function remindersScreen() {
  const list = reminders.filter(r => (remTab === "history" ? r.done : !r.done));
  const tab = (key, name) => '<button class="' + (remTab === key ? "on" : "") + '" onclick="remTab = \'' + key + '\'; render()">' + name + "</button>";
  return header("Survival Suite", "Reminders through your day", "dashboard") +
    '<div class="tabs two">' + tab("reminders", "Reminders") + tab("history", "History") + "</div>" +
    (list.length === 0 ? '<section class="card"><p class="small">Nothing to show.</p></section>' :
      list.map(r => '<section class="card"><div class="row between"><h3>' + r.title + '</h3><span class="pill">' + r.time + "</span></div>" +
        '<p class="small">' + r.text + "</p>" +
        (r.done ? '<p class="small">Done</p>' : '<button class="btn small" style="align-self:flex-start" onclick="doneReminder(' + r.id + ')">' + r.action + "</button>") +
      "</section>").join("")) +
    '<button class="btn ghost block" onclick="openNotifications()">Notification Settings</button>';
}
function doneReminder(id) {
  const r = reminders.find(x => x.id === id);
  r.done = true;
  if (r.title === "Task Reminder") { go("tasks"); return; }
  render();
  toast("Done", "Marked as done. It is in History now.");
}

// ----- Notification Settings (sheet) and toggles -----
const NOTIF_ROWS = [["dnd", "Do Not Disturb"], ["hydration", "Hydration reminders"], ["rest", "Rest reminders"], ["taskAlerts", "Task alerts"]];
function notifToggles() {
  return '<div class="group">' + NOTIF_ROWS.map(r =>
    '<div class="setting"><label class="grow" for="n-' + r[0] + '">' + r[1] + "</label>" +
    '<input type="checkbox" class="switch" id="n-' + r[0] + '" ' + (notif[r[0]] ? "checked" : "") + ' onchange="notif.' + r[0] + ' = this.checked"></div>'
  ).join("") + "</div>";
}
function openNotifications() {
  openSheet("Notification Settings", notifToggles());
}

// ----- Profile -----
function profileScreen() {
  const row = (iconName, label, action) => '<button class="setting" onclick="' + action + '">' + icon(iconName) +
    '<span class="grow">' + label + '</span><span class="chev">›</span></button>';
  return header("Profile", "Make Lumenstru feel like yours") +
    '<section class="card"><div class="row"><span class="mascot" style="--size:64px" aria-hidden="true"></span>' +
      '<div class="grow"><h2>' + esc(userName) + '</h2><p class="small">' + USER_EMAIL + "</p></div>" +
      '<button class="iconbtn" aria-label="Edit name" onclick="editName()">' + icon("edit") + "</button></div></section>" +
    '<div class="group">' +
      row("heart", "My Cycle and Profile", "go('logPeriod')") +
      row("bell", "Reminders", "go('reminders')") +
      row("bell", "Notification Settings", "openNotifications()") +
      row("gear", "App Settings", "go('settings')") +
      row("help", "Help and Support", "showHelp()") +
      row("info", "About", "showAbout()") +
    "</div>" +
    '<div class="group"><div class="setting">' + icon("calm") + '<label class="grow" for="p-dark">Lavender (dark) mode</label>' +
      '<input type="checkbox" class="switch" id="p-dark" ' + (isDark() ? "checked" : "") + ' onchange="setMode(this.checked ? \'dark\' : \'light\')"></div></div>' +
    '<button class="btn block" onclick="logOut()">Log out</button>';
}
function editName() {
  openSheet("Edit Profile",
    '<label class="field" for="e-name">Display name<input id="e-name" value="' + esc(userName) + '"></label>' +
    '<button class="btn block" onclick="saveName()">Save changes</button>', true);
}
function saveName() {
  const v = document.getElementById("e-name").value.trim();
  if (v) userName = v;
  closeSheet();
  render();
  toast("Profile updated", "Your name is saved.");
}
function showHelp() {
  openSheet("Help and Support", "<p>Ask the AI Assistant anything, or read the user guide that comes with the app.</p>");
}
function showAbout() {
  openSheet("About Lumenstru AI", "<p>Lumenstru AI is a study planner that plans around your cycle. Matcha Mode by day, Lavender Mode on low-energy days. Version 1.0, prototype.</p>");
}
function logOut() {
  go("signin");
  toast("Logged out", "See you soon.");
}

// ----- App Settings -----
function settingsScreen() {
  return header("App Settings", "Make the app work for you", "profile") +
    '<span class="label">Theme</span>' +
    '<div class="chips"><button class="chip ' + (isDark() ? "" : "on") + '" onclick="setMode(\'light\')">Matcha</button>' +
      '<button class="chip ' + (isDark() ? "on" : "") + '" onclick="setMode(\'dark\')">Lavender</button></div>' +
    '<span class="label">Notifications</span>' + notifToggles();
}

// ----- Matcha / Lavender mode -----
let mode = load("mode", "light");
function isDark() {
  return mode === "dark";
}
function setMode(m) {
  mode = m;
  save("mode", m);
  document.documentElement.setAttribute("data-theme", m);
  document.getElementById("btn-matcha").classList.toggle("on", !isDark());
  document.getElementById("btn-lavender").classList.toggle("on", isDark());
  render();
}

// ----- bottom sheet and toast -----
// hasButton = the body already has its own button, so no "Done" is added
function openSheet(title, body, hasButton) {
  document.getElementById("sheet-root").innerHTML =
    '<div class="overlay" onclick="if (event.target === this) closeSheet()">' +
      '<div class="sheet" role="dialog" aria-label="' + title + '"><div class="handle"></div>' +
        "<h2>" + title + "</h2>" + body +
        (hasButton ? "" : '<button class="btn block" onclick="closeSheet()">Done</button>') +
      "</div>" +
    "</div>";
}
function closeSheet() {
  document.getElementById("sheet-root").innerHTML = "";
}
let toastTimer = null;
function toast(title, text) {
  document.getElementById("toast-root").innerHTML =
    '<div class="toast" role="status"><span class="mascot" style="--size:34px" aria-hidden="true"></span><div class="grow"><b>' + esc(title) + '</b><p class="small">' + esc(text) + "</p></div></div>";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { document.getElementById("toast-root").innerHTML = ""; }, 3500);
}

// ----- start -----
function showClock() {
  const now = new Date();
  document.getElementById("clock").textContent = now.getHours() + ":" + String(now.getMinutes()).padStart(2, "0");
}
showClock();
setInterval(showClock, 30000);

// open a screen from the link, e.g. index.html#calendar
const start = location.hash.slice(1);
if (NAV_ITEMS.some(item => item[0] === start)) screen = start;
if (screen === "logPeriod") startLog(TODAY_ISO);
setMode(mode);
</script>
